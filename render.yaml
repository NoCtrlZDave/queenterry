# Render.com Blueprint for Queen Terry Store
# https://render.com/docs/blueprint-spec
#
# Deploys a single Node.js web service that runs the Express API and serves
# the built React storefront (client/dist). MongoDB is NOT provisioned by
# Render - set MONGODB_URI to a MongoDB Atlas (or other) connection string
# in the Render dashboard before the first deploy.
services:
  - type: web
    name: queen-terry-store
    env: node
    rootDir: .
    # npm workspaces install server + client dependencies, then build the Vite client
    # --include=dev is required because NODE_ENV=production would otherwise skip Vite
    buildCommand: npm install --include=dev && npm run build
    # Express serves the API plus the built client with SPA fallback
    startCommand: NODE_ENV=production npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      # MongoDB Atlas connection string for the Queen Terry store database.
      - key: MONGODB_URI
        value: mongodb+srv://okorochukwuebuka34_db_user:6jZZCWAb9wpVYoG2@cluster0.e7jqchd.mongodb.net
      # Secret used to sign JWT auth cookies. Set a long random string in the Render dashboard before the first deploy.
      - key: JWT_SECRET
        value: change-me-in-render-dashboard
      # Admin account password. Override in the Render dashboard if you want a known password.
      - key: ADMIN_PASSWORD
        value: ChangeMe123!
      - key: ADMIN_NAME
        value: Queen Terry Admin
      - key: ADMIN_EMAIL
        value: admin@queenterry.test
      - key: ADMIN_PHONE
        value: 09025068558
      - key: WHATSAPP_NUMBER
        value: 2349025068558
      # Cloudinary (product image uploads)
      - key: CLOUDINARY_CLOUD_NAME
        value: b1gfrg0t
      - key: CLOUDINARY_API_KEY
        value: 449693945192121
      - key: CLOUDINARY_API_SECRET
        value: orlVE6ILah2LG9vwDBjCpv0Hr2o
      # Public URL of the storefront (Vercel). Update if your deployment URL differs.
      - key: CLIENT_ORIGIN
        value: https://queenterry.vercel.app
      # Seed demo products on first boot when the catalogue is empty
      - key: SEED_DEMO
        value: true
    # Persistent disk for uploaded product images (server/uploads).
    # Render's filesystem is ephemeral, so uploads are lost on every deploy without this.
    disk:
      name: queen-terry-uploads
      mountPath: /opt/render/project/src/server/uploads
      sizeGB: 1